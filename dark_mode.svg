<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="420px" font-size="14px">
<defs>
  <radialGradient id="bg-glow" cx="25%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#2e1065" stop-opacity="0.35" />
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
  </radialGradient>
  <radialGradient id="bg-glow2" cx="85%" cy="25%" r="40%">
    <stop offset="0%" stop-color="#831843" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
  </radialGradient>
  <linearGradient id="art-grad" x1="0%" y1="0%" x2="20%" y2="100%">
    <stop offset="0%" stop-color="#d8b4fe" />
    <stop offset="35%" stop-color="#a855f7" />
    <stop offset="70%" stop-color="#c026d3" />
    <stop offset="100%" stop-color="#ec4899" />
  </linearGradient>
  <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5" />
    <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35" />
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
  </linearGradient>
  <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a855f7" />
    <stop offset="50%" stop-color="#ec4899" />
    <stop offset="100%" stop-color="#f59e0b" />
  </linearGradient>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
    <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5" />
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.2" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="art-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="0.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</defs>
<style>
@font-face {
    src: local('Consolas'), local('Consolas Bold');
    font-family: 'ConsolasFallback';
    font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; transform: translateX(-8px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes slideIn {
  0% { opacity: 0; transform: translateY(-8px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-150px); }
  100% { transform: translateY(420px); }
}
@keyframes borderPulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.7; }
}
@keyframes dotPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes lineExpand {
  0% { stroke-dashoffset: 360; }
  100% { stroke-dashoffset: 0; }
}

.key {fill: #c084fc; font-weight: bold;}
.val {fill: #e2e8f0;}
.hd {fill: #f8fafc; font-weight: bold; font-size: 15px;}
.hd-sub {fill: #a78bfa; font-size: 11px; font-weight: normal;}
.cc {fill: #4c1d95;}
.art { fill: url(#art-grad); animation: draw 2s ease-out forwards; }
.info { animation: slideIn 0.8s ease-out 0.4s backwards; }
.contact { animation: slideIn 0.8s ease-out 0.7s backwards; }
.stats { animation: slideIn 0.8s ease-out 1s backwards; }
.scan { animation: scanline 8s linear infinite; opacity: 0.06; fill: url(#scanline-gradient); pointer-events: none; }
.border-frame { animation: borderPulse 5s ease-in-out infinite; }
.status-dot { fill: #22c55e; animation: dotPulse 2.5s ease-in-out infinite; }
.stats-line { animation: lineExpand 2s ease-out 1.2s backwards; stroke-dasharray: 360; }

text, tspan {white-space: pre;}
</style>

<!-- Background layers -->
<rect width="880" height="420" fill="#0d1117" rx="12" />
<rect width="880" height="420" fill="url(#bg-glow)" rx="12" />
<rect width="880" height="420" fill="url(#bg-glow2)" rx="12" />

