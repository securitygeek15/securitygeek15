<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%">
<defs>
  <style>
    @font-face {
        src: local('Consolas'), local('Consolas Bold');
        font-family: 'ConsolasFallback';
        font-display: swap;
    }
    .bg { fill: #050505; }
    .text-main { fill: #ffffff; font-family: ConsolasFallback, Consolas, monospace; font-size: 13px; font-weight: bold; }
    .text-muted { fill: #a1a1aa; font-family: ConsolasFallback, Consolas, monospace; font-size: 12px; }
    .text-accent { fill: #ef4444; font-family: ConsolasFallback, Consolas, monospace; font-size: 13px; font-weight: bold; }
    .micro-text { fill: #a1a1aa; font-family: ConsolasFallback, Consolas, monospace; font-size: 10px; letter-spacing: 2px; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 10px #ef4444); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px #ef4444); }
    }
    @keyframes barAnim {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(450px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    .art {
        fill: #ffffff;
        font-family: ConsolasFallback, Consolas, monospace;
        font-size: 12px;
        white-space: pre;
    }
    
    /* The hologram effect applies an intense red glow to the Braille art */
    .hologram {
        fill: #ef4444;
        animation: pulseGlow 4s infinite ease-in-out;
        opacity: 0.85;
    }
    
    .bar {
        transform-origin: bottom;
        animation: barAnim infinite ease-in-out;
    }
    .cursor { animation: blink 1s infinite; fill: #ef4444; }
    .scan { animation: scanline 8s linear infinite; fill: url(#scan-grad); pointer-events: none; opacity: 0.15; }
  </style>
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 20 40 M 0 20 L 40 20" stroke="#ffffff11" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="20" cy="20" r="1.5" fill="#ef444433" />
  </pattern>
  
  <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
    <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
  </linearGradient>
  
  <linearGradient id="art-fade" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="1" />
    <stop offset="70%" stop-color="#ef4444" stop-opacity="0.3" />
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
  </linearGradient>
</defs>


