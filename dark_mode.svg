font-family: 'ConsolasFallback';
font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}
.key {fill: #ffa657; font-weight: bold;}
.val {fill: #79c0ff; text-shadow: 0 0 4px rgba(121, 192, 255, 0.4);}
.hd {fill: #e6edf3; font-weight: bold; font-size: 15px;}
.cc {fill: #484f58;}
.art { animation: draw 1.5s ease-in-out forwards; }
.info { animation: slideDown 1s ease-out 0.5s backwards; }
.contact { animation: slideDown 1s ease-out 0.8s backwards; }
text, tspan {white-space: pre;}
