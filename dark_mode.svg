<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="400px" font-size="14px">
<defs>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#79c0ff" stop-opacity="0" />
    <stop offset="50%" stop-color="#79c0ff" stop-opacity="1" />
    <stop offset="100%" stop-color="#79c0ff" stop-opacity="0" />
  </linearGradient>
</defs>
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-100px); }
  100% { transform: translateY(400px); }
}
.key {fill: #ffa657; font-weight: bold;}
.val {fill: #79c0ff; text-shadow: 0 0 4px rgba(121, 192, 255, 0.4);}
.hd {fill: #e6edf3; font-weight: bold; font-size: 15px;}
.cc {fill: #484f58;}
.art { animation: draw 1.5s ease-in-out forwards; }
.info { animation: slideDown 1s ease-out 0.5s backwards; }
.contact { animation: slideDown 1s ease-out 0.8s backwards; }
.stats { animation: slideDown 1s ease-out 1.1s backwards; }
.scan { animation: scanline 8s linear infinite; opacity: 0.05; fill: url(#scanline-gradient); pointer-events: none; }
text, tspan {white-space: pre;}
</style>
