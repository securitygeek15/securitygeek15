<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%">
<defs>
  <style>
    @font-face {
        font-family: 'ConsolasFallback';
        src: local('Consolas'), local('Fira Code'), local('Cascadia Code'), local('Courier New'), monospace;
        font-display: swap;
    }
    .bg { fill: #000000; }
    .text-main { fill: #ffffff; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 13px; font-weight: bold; }
    .text-muted { fill: #777777; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 11px; }
    .text-title { fill: #ffffff; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
    .text-header { fill: #ffffff; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    .micro-text { fill: #777777; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 10px; letter-spacing: 1px; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(430px); }
    }
    
    .art {
        fill: #ffffff;
        font-family: 'ConsolasFallback', Consolas, monospace;
        font-size: 5.4px;
        line-height: 1;
        white-space: pre;
        opacity: 0.95;
    }
    
    .cursor { animation: blink 1s infinite; fill: #ffffff; }
    .scan { animation: scanline 8s linear infinite; fill: url(#scan-grad); pointer-events: none; opacity: 0.1; }
  </style>
  
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ffffff0a" stroke-width="0.5" />
    <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff0a" stroke-width="0.5" />
  </pattern>
  
  <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
  </linearGradient>
</defs>


