<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="420px" font-size="14px">
<defs>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
    <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
      </feMerge>
  </filter>
</defs>
<style>
@font-face {
    src: local('Consolas'), local('Consolas Bold');
    font-family: 'ConsolasFallback';
    font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; filter: hue-rotate(90deg); }
  100% { opacity: 1; filter: hue-rotate(0deg); }
}
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-100px); }
  100% { transform: translateY(420px); }
}
@keyframes spin { 
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes spin-reverse { 
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}
.key {fill: #00f3ff; font-weight: bold; text-shadow: 0 0 5px rgba(0, 243, 255, 0.6);}
.val {fill: #9ce2ff; text-shadow: 0 0 5px rgba(0, 243, 255, 0.6);}
.hd {fill: #e6edf3; font-weight: bold; font-size: 15px;}
.cc {fill: #006b85;}
.art { text-shadow: 0 0 3px rgba(0, 243, 255, 0.4); animation: draw 2s ease-in-out forwards; }
.info { animation: slideDown 1s ease-out 0.5s backwards; }
.contact { animation: slideDown 1s ease-out 0.8s backwards; }
.stats { animation: slideDown 1s ease-out 1.1s backwards; }
.scan { animation: scanline 6s linear infinite; opacity: 0.15; fill: url(#scanline-gradient); pointer-events: none; mix-blend-mode: screen; }

.hud-container {
    transform-origin: 440px 210px;
    animation: hud-perspective 3s ease-out forwards;
}
@keyframes hud-perspective {
    0% { transform: perspective(1200px) rotateY(-15deg) rotateX(10deg) scale(0.9); opacity: 0; }
    100% { transform: perspective(1200px) rotateY(-3deg) rotateX(2deg) scale(1); opacity: 1; }
}

.hud-spinner1 { animation: spin 20s linear infinite; transform-origin: 650px 180px; opacity: 0.3; stroke: #00f3ff; fill: none; }
.hud-spinner2 { animation: spin-reverse 15s linear infinite; transform-origin: 650px 180px; opacity: 0.2; stroke: #00f3ff; fill: none; }
.hud-spinner3 { animation: spin 35s linear infinite; transform-origin: 650px 180px; opacity: 0.1; stroke: #9ce2ff; fill: none; }
.hud-grid { stroke: #00475c; stroke-width: 1; opacity: 0.1; }

text, tspan {white-space: pre;}
</style>
