<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="420px" font-size="14px">
<defs>
  <linearGradient id="art-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="40%" stop-color="#e4e4e7" stop-opacity="0.5" />
    <stop offset="70%" stop-color="#ef4444" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
  </linearGradient>
  <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
    <stop offset="50%" stop-color="#dc2626" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3" />
  </linearGradient>
  <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
    <stop offset="20%" stop-color="#ef4444" />
    <stop offset="80%" stop-color="#dc2626" />
    <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
  </linearGradient>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
    <stop offset="50%" stop-color="#ef4444" stop-opacity="0.3" />
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
  </linearGradient>
  <radialGradient id="bg-vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0a0a0a" />
    <stop offset="100%" stop-color="#000000" />
  </radialGradient>
  <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="0.8" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</defs>
<style>
@font-face {
    src: local('Consolas'), local('Consolas Bold');
    font-family: 'ConsolasFallback';
    font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes slideIn {
  0% { opacity: 0; transform: translateY(-6px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-150px); }
  100% { transform: translateY(420px); }
}
@keyframes borderPulse {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.5; }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@keyframes lineReveal {
  0% { stroke-dashoffset: 400; }
  100% { stroke-dashoffset: 0; }
}

.key {fill: #ef4444; font-weight: bold;}
.val {fill: #e4e4e7;}
.hd {fill: #ffffff; font-weight: bold; font-size: 15px; letter-spacing: 1px;}
.cc {fill: #3f3f46;}
.art { fill: url(#art-grad); animation: draw 1.5s ease-out forwards; }
.info { animation: slideIn 0.6s ease-out 0.3s backwards; }
.contact { animation: slideIn 0.6s ease-out 0.6s backwards; }
.stats { animation: slideIn 0.6s ease-out 0.9s backwards; }
.scan { animation: scanline 10s linear infinite; opacity: 0.04; fill: url(#scanline-gradient); pointer-events: none; }
.border-frame { animation: borderPulse 6s ease-in-out infinite; }
.status-dot { fill: #ef4444; animation: blink 3s ease-in-out infinite; }
.divider-line { animation: lineReveal 1.5s ease-out 1s backwards; stroke-dasharray: 400; }

text, tspan {white-space: pre;}
</style>


