<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="930px" font-size="14px">
<defs>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a3069" stop-opacity="0" />
    <stop offset="50%" stop-color="#0a3069" stop-opacity="1" />
    <stop offset="100%" stop-color="#0a3069" stop-opacity="0" />
  </linearGradient>
</defs>
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-100px); }
  100% { transform: translateY(930px); }
}
.key {fill: #953800; font-weight: bold;}
.val {fill: #0a3069; text-shadow: 0 0 2px rgba(10, 48, 105, 0.2);}
.hd {fill: #24292f; font-weight: bold; font-size: 15px;}
.cc {fill: #24292f;}
.art { animation: draw 1.5s ease-in-out forwards; }
.info { animation: slideDown 1s ease-out 0.5s backwards; }
.contact { animation: slideDown 1s ease-out 0.8s backwards; }
.stats { animation: slideDown 1s ease-out 1.1s backwards; }
.scan { animation: scanline 8s linear infinite; opacity: 0.05; fill: url(#scanline-gradient); pointer-events: none; }
text, tspan {white-space: pre;}
</style>
<rect width="880" height="930" fill="#f6f8fa" rx="12" />
<rect width="880" height="100" class="scan" />


