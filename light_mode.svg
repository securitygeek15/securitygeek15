<defs>
  <linearGradient id="scanline-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0969da" stop-opacity="0" />
    <stop offset="50%" stop-color="#0969da" stop-opacity="1" />
    <stop offset="100%" stop-color="#0969da" stop-opacity="0" />
