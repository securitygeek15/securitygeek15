<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
}
@keyframes draw {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes slideDown {
  0% { opacity: 0; transform: translateY(-10px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scanline {
  0% { transform: translateY(-100px); }
  100% { transform: translateY(400px); }
}
.key {fill: #0550ae; font-weight: bold;}
.val {fill: #0969da; }
.hd {fill: #24292f; font-weight: bold; font-size: 15px;}
.cc {fill: #57606a;}
.art { animation: draw 1.5s ease-in-out forwards; }
.info { animation: slideDown 1s ease-out 0.5s backwards; }
.contact { animation: slideDown 1s ease-out 0.8s backwards; }
.stats { animation: slideDown 1s ease-out 1.1s backwards; }
.scan { animation: scanline 8s linear infinite; opacity: 0.05; fill: url(#scanline-gradient); pointer-events: none; }
text, tspan {white-space: pre;}
</style>
