<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
<defs>
  <style>
    @font-face {
        font-family: 'ConsolasFallback';
        src: local('Consolas'), local('Fira Code'), local('Cascadia Code'), local('Courier New'), monospace;
        font-display: swap;
    }
    .bg { fill: url(#bg-grad); }
    .font-mono { font-family: 'ConsolasFallback', Consolas, 'Fira Code', monospace; }
    
    .text-main { fill: #0f172a; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 13px; font-weight: 600; }
    .text-muted { fill: #64748b; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 11px; }
    .text-accent { fill: #2563eb; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
    .text-title { fill: #0f172a; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 21px; font-weight: 800; letter-spacing: 1px; }
    .text-stat-val { fill: #0f172a; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 16px; font-weight: 800; }
    .text-stat-lbl { fill: #64748b; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 10px; letter-spacing: 1px; font-weight: 600; }
    .micro-text { fill: #64748b; font-family: 'ConsolasFallback', Consolas, monospace; font-size: 10px; letter-spacing: 1.5px; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 3px #2563eb); }
      50% { opacity: 1; filter: drop-shadow(0 0 9px #2563eb); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4; }
      50% { opacity: 0.4; r: 5; }
    }
    @keyframes scanline {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(470px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .art {
        fill: #2563eb;
        font-family: 'ConsolasFallback', Consolas, monospace;
        font-size: 7.8px;
        white-space: pre;
        opacity: 0.85;
    }
    
    .hologram {
        animation: pulseGlow 4s infinite ease-in-out;
    }
    
    .cursor { animation: blink 1s infinite; fill: #2563eb; }
    .status-dot { animation: pulseDot 2s infinite ease-in-out; fill: #059669; }
    .scan { animation: scanline 7s linear infinite; fill: url(#scan-grad); pointer-events: none; opacity: 0.12; }
    .radar-line { transform-origin: 675px 305px; animation: radarSpin 12s linear infinite; }
  </style>
  
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="100%" stop-color="#f1f5f9" />
  </linearGradient>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2563eb0d" stroke-width="1" />
    <circle cx="30" cy="30" r="1" fill="#2563eb33" />
  </pattern>
  
  <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2563eb" stop-opacity="0" />
    <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
  </linearGradient>

  <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
    <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.7" />
  </linearGradient>
  
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>


